; lua-bridge configuration.
; Drop this next to lua_bridge.asi in your game folder.

[repl]
; Host to bind the REPL listener on. 127.0.0.1 = localhost-only,
; which is what you want unless you're routing through a tunnel.
host = 127.0.0.1

; Port for the REPL listener. Matches the default the upstream
; tools/lua_repl.py and tools/lua_console.py expect.
port = 27050

[loader]
; Enable or disable the native Lua Loader (1 = enabled, 0 = disabled)
loader_enabled = 1

; Load scripts in scripts/OnBoot/ once captured (1 = enabled, 0 = disabled)
loader_onboot = 1

; Load scripts in scripts/OnLoad/ once game enters world (1 = enabled, 0 = disabled)
loader_onload = 1

; DEPRECATED in v0.5.0 and now a no-op. ExecuteLuaFolder runs ON the game
; thread, so sleeping between scripts could never let the engine settle the
; way this name suggests -- the engine IS the thread being slept. All it
; bought was a delay * (scripts-1) freeze on top of every load. Still parsed
; so existing .ini files stay valid.
loader_delay_ms = 50

; Minimum time (ms) between the SAME OnKey script re-firing. Stops hammer-
; tapping a hotkey from queueing several back-to-back runs of a script that
; isn't reentrant. 0 disables.
loader_onkey_cooldown_ms = 250

; Drop OnKey hotkey fires while the game is NOT the foreground window.
; Before 0.5.0 hotkeys fired regardless of focus, so pressing F5 in a browser
; (refresh) or F11 (fullscreen) silently ran your game scripts in the
; background. Loader.PopKeyEvents has always been focus-gated; this makes the
; .lua-firing path agree with it. 0 = old behavior.
loader_onkey_require_focus = 1

; Require the held modifier set to match a binding EXACTLY, so you can bind
; `F5` and `ctrl+F5` to two different scripts. Side effect: a plain `F5`
; binding no longer fires while ctrl/shift/alt is held. 0 = ignore modifiers
; entirely (pre-0.5.0 matching).
loader_onkey_exact_modifiers = 1

; Re-run OnBoot/OnLoad after a main-menu round-trip. The engine wipes _G when
; you exit to the menu and builds fresh Lua VMs on the next load, so without
; this every OnLoad-installed framework stays dead until you restart the game.
; 0 = once per process.
loader_rearm_on_menu = 1

; Track the world-load phase ladder (0..20) so Loader.GetLoadPhase() works and
; the re-arm above can see a load restart. Costs a substring scan per captured
; game log line. 0 removes that cost but disables both features.
loader_track_phase = 1

; Source-encoding normalization for .lua files and WS-submitted chunks. The
; engine's text renderers consume single-byte CP1252, so a UTF-8 source file
; renders "Mobius" (with o-umlaut) as "MA-bius". auto strips BOMs and
; transcodes UTF-8 -> CP1252 only when the bytes are valid UTF-8 AND contain a
; byte >= 0x80, so pure-ASCII and already-ANSI files are never touched.
; off = raw bytes through (BOMs still stripped -- a BOM is a Lua syntax error).
loader_source_encoding = auto

; Watchdog: if the bridge makes no progress for this many ms while work is
; outstanding, a background thread force-resets its stuck-state candidates and
; logs a diagnostic. 0 disables.
watchdog_stuck_ms = 8000

; WebSocket transport (1 = enabled). The listener auto-detects raw TCP vs
; WebSocket from the first bytes. 0 locks it to raw-TCP only.
websocket_enabled = 1

; Lua stack-layout dump for the first 8 chunk executions. It was written to
; answer two questions, and both are now answered: this build's pcall leaves a
; table where stock leaves its boolean status (results start one slot later),
; and it writes that status into the frame of the hooked function the bridge is
; running inside -- which the executor now snapshots and restores around every
; call. Kept enabled as a regression detector: if the corruption ever returns,
; the dump prints "CHANGED - pcall wrote the engine's frame!" and that line is
; how you would find out. Costs one burst of log lines per process; set to 0
; if you want a quieter log.
stack_diag = 1
